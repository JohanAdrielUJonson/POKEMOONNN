<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Emerald - Start Screen</title>
    <link rel="stylesheet" href="startscreen.css">
</head>
<body>

    <!-- Main Container supporting horizontal scroll if image overflows -->
    <div class="screen-container">
        <!-- Background Wrapper -->
        <div class="background-wrapper">
            <img src="images/startscreen1.png" alt="Pokémon Emerald Start Screen" class="bg-image">

            <!-- Interactive START Button positioned overlaying below the logo -->
            <a href="description.html" class="start-btn" id="startBtn">
                <span class="btn-text">START</span>
            </a>
        </div>
    </div>

    <script src="startscreen.js"></script>
</body>
</html>
